resolver 127.0.0.1 valid=5s;

upstream frontend {
    server acme-staging-frontend:3000 max_fails=1 fail_timeout=2s;
    server retired-acme-staging-frontend:3000 backup;
}

upstream backend {
    server acme-staging-backend:3001 max_fails=1 fail_timeout=2s;
    server retired-acme-staging-backend:3001 backup;
}

server {
    listen 3000;
    merge_slashes off;

    client_max_body_size 1024M;

    location /api/ {
        proxy_pass http://backend/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
