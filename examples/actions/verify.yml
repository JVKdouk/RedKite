# Build every app and run the checks each one declares, against a test
# environment. Nothing is swapped, so this is safe to run on a pull request
# from the moment it opens.
#
# Copy this to .github/workflows/verify.yml in the repository being deployed.

name: verify

on: pull_request

# One run per branch. A superseded check is worth cancelling: nothing it does
# outlives it
concurrency:
  group: verify-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No ssh-key: the apps are built from the checkout this job already has,
      # and a verify environment names no host to reach. The runner needs no
      # key at all, which is the point of testing the tree in the pull request
      # rather than the branch it was pushed from
      - uses: JVKdouk/redkite@v1
        with:
          command: verify
          environment: test
        env:
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}

      # A verify brings a network and its services up and never swaps, so what
      # a cancelled or finished run leaves behind is those. Stopped rather than
      # removed, so the next run adopts them instead of building them again
      - if: always()
        uses: JVKdouk/redkite@v1
        with:
          command: down
          environment: test
